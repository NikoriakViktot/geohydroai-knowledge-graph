[project]
name = "ghai-client"
version = "0.1.0"
description = "Python client for the GeoHydroAI Knowledge API (single module, httpx only)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ghai_client"]
