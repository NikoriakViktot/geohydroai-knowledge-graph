# ── Block C — vertical-datum harmonisation ───────────────────────────────────

- id: T08
  block: C
  statement: >
    Satellite altimetry, gauge records and historical hydrological observations are
    frequently referenced to different ellipsoids, geoids, national height systems
    and permanent-tide conventions, so apparent centimetre- to decimetre-scale
    differences may be geodetic rather than hydrological.
  rationale: >
    The central methodological claim. The hydraulic signal under investigation
    (~3 cm/km) is the same order as the correction terms, so a study that skips
    harmonisation cannot separate the two.
  search_queries:
    - "vertical datum differences between satellite altimetry gauges and national height systems"
    - "geoid model choice affecting water level comparison between sensors"
    - "ellipsoidal versus orthometric heights in satellite hydrology"
    - "converting satellite water surface elevation to a national vertical reference"
    - "vertical reference frame consistency in multi-mission water level studies"
  openalex_queries:
    - "vertical datum harmonization satellite altimetry water level"
    - "geoid model water level gauge altimetry comparison"
    - "ellipsoidal orthometric height inland water altimetry"
  key_terms:
    - ["vertical datum", "vertical reference", "height system", "geoid", "quasigeoid", "ellipsoidal height", "orthometric height", "EGM2008", "EGM96", "EVRF", "EGG2015"]
    - ["altimet", "satellite", "gauge", "water level", "water surface elevation", "WSE"]
    - ["bias", "offset", "difference", "discrepancy", "consistency", "harmonis", "harmoniz", "transformation"]
  negative_terms:
    - "tidal datum for navigation charts"
    - "chart datum sounding reduction only"
  positive_controls:
    - doi: "10.23939/istcgcap2021.93.013"
