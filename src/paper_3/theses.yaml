# ── Block D — collocation and the independent statistical unit ───────────────

- id: T12
  block: D
  statement: >
    Apparent cross-sensor bias in water-surface elevation depends strongly on
    temporal and spatial collocation, and can reflect real hydrodynamic variability
    rather than instrumental error.
  rationale: >
    Our ICESat-2–SWOT residual falls sharply with better temporal proximity, which
    means a reported bias without a stated matchup window is not comparable.
