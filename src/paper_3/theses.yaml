# T01–T36 — thesis cards for the Kakhovka post-breach transformation manuscript.
#
# This file is the single source of truth for the gap analysis. The OpenAlex query
# set, the semantic retrieval queries, the structural prefilter and every count in
# GAP_MATRIX are derived from it, so a reviewer can read this file and know exactly
# what was searched for and what was deliberately excluded.
#
# Field contract (see theses.py):
#   search_queries    natural-language, encoded with SPECTER2 against ChromaDB (>=3)
#   openalex_queries  keyword forms sent to the OpenAlex /works search endpoint (>=1)
#   key_terms         term FAMILIES. The prefilter requires a hit in >=2 DIFFERENT
#                     families, which is what stops a flood-mapping corpus from
#                     answering every altimetry query with flood-mapping papers.
#   negative_terms    load-bearing, not decoration: "SWOT" collides with SWOT
#                     analysis, "dam removal" with "removal of dam-related bias".
#   positive_controls HOLD-OUT recall benchmark. Each control is ingested into the
#                     corpus during the harvest and then retrieval must find it
#                     UNAIDED — controls are never injected into the candidate set,
#                     because a recall measured against a search that was handed
#                     the answer measures nothing. `manually_checked: true`
#                     requires a `quote` proving someone read it.
#   manuscript_anchor the draft section this thesis underwrites.
#   numeric_anchor    the draft's own number this thesis has to defend, if any.
#
# British spelling throughout, to match the manuscript.

# ── Block A — what a reservoir-to-river hydraulic transition means ────────────

- id: T01
  block: A
  statement: >
    Reservoirs and rivers differ systematically in longitudinal water-surface
    geometry: impounded reaches tend towards low longitudinal gradients, whereas
    free-flowing reaches maintain persistent downstream gradients controlled by
    discharge, channel geometry, roughness and backwater conditions.
  rationale: >
    The premise the whole manuscript rests on. If impounded and free-flowing
    reaches were not separable by longitudinal gradient, a slope change could not
    diagnose a regime change.
  search_queries:
    - "longitudinal water surface profile of an impounded river reach versus a free-flowing reach"
    - "backwater effect on water surface slope upstream of a dam"
    - "water surface slope controlled by discharge channel geometry and roughness"
    - "hydraulic gradient along a reservoir compared with the river upstream"
    - "gradually varied flow backwater curve reservoir longitudinal profile"
  openalex_queries:
    - "longitudinal water surface profile impounded river"
    - "backwater water surface slope reservoir"
    - "free flowing river water surface gradient hydraulics"
  key_terms:
    - ["water surface slope", "water-surface slope", "surface gradient", "longitudinal gradient", "hydraulic gradient", "free-surface slope"]
    - ["reservoir", "impound", "backwater", "dam pool", "free-flowing", "free flowing"]
    - ["longitudinal profile", "long profile", "water surface profile", "chainage", "thalweg"]
  negative_terms:
    - "land surface slope"
    - "terrain slope"
    - "hillslope"
  positive_controls:
    - doi: "10.1029/2023wr036428"
      relevance: method
      expected_stage: semantic_retrieval
      difficulty: easy
      source_of_seed: external_search
      manually_checked: false   # TODO: read it, add a quote, flip to true
      quote: ""
      section: ""
      note: "Hydraulic river models from ICESat-2 elevation and water surface slope"
  expected_relations: [SUPPORTS, METHOD_RELEVANT]
  manuscript_anchor: "1.2 Why post-breach water-surface geometry matters"
  numeric_anchor: null

- id: T02
