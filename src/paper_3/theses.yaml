  statement: >
    Dam removal, dam failure or rapid reservoir drawdown can produce an abrupt
    transition from impounded hydraulic conditions towards a channelised fluvial
    regime, expressed through changes in water-surface slope, velocity, shear
    stress, width and connectivity.
  rationale: >
    Establishes the mechanism as known in the dam-removal literature, where rising
    water-surface slope is the classic response to base-level lowering. Determines
    whether our contribution is the mechanism or its detection from space.
  search_queries:
    - "geomorphic and hydraulic response of a river to dam removal"
    - "water surface slope increase after dam removal base level lowering"
    - "reservoir drawdown channel incision and knickpoint migration"
    - "dam failure hydraulic regime change downstream channel"
    - "sediment and shear stress response to removal of an impoundment"
