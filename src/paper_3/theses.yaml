# ── Block B — satellites must see surface geometry, not a single level ────────

- id: T04
  block: B
  statement: >
    Treating a lake or reservoir as a single water-surface elevation may hide
    meaningful spatial gradients and hydraulic heterogeneity.
  rationale: >
    Directly challenged by Huang & Gao (2026), who show spatially uneven lake
    surfaces biasing ICESat-2 level time series. Determines whether this is our
    finding or an established one we build on.
  search_queries:
    - "spatial variability of water surface elevation within a single lake"
    - "assumption of a flat lake surface in satellite water level retrieval"
    - "uneven water surface elevation across a reservoir affects level time series"
    - "lake level from altimetry biased by within-lake elevation gradients"
  openalex_queries:
    - "uneven lake water surface elevation satellite altimetry bias"
    - "spatial variability water surface elevation within lake"
    - "flat lake surface assumption water level retrieval"
  # Most specific family first: is_on_topic() requires it. Neither "water level"
  # nor a bare "spatial variability" can lead — both match most of this corpus.
  # The thesis is about variability OF THE WATER SURFACE WITHIN one body, so the
  # primary family binds the two ideas together.
  key_terms:
    - ["spatially uneven water", "uneven water surface", "water surface variability",
       "within-lake", "within lake", "within the lake", "across the lake",
       "not flat", "lake surface tilt", "tilted water surface",
       "heterogeneous water surface", "spatially varying water surface"]
    - ["spatially uneven", "spatial variability", "heterogen", "tilt", "gradient"]
    - ["water surface elevation", "water-surface elevation", "WSE", "water level", "lake level"]
    - ["lake", "reservoir", "impound"]
  negative_terms:
    - "sea surface height"
    - "ocean dynamic topography"
  positive_controls:
    - doi: "10.1029/2025gl119771"
      relevance: direct
      expected_stage: semantic_retrieval
      difficulty: easy
      source_of_seed: external_search
      manually_checked: false   # TODO: read it, add a quote, flip to true
      quote: ""
      section: ""
      note: "Huang & Gao 2026 GRL — SWOT-mapped uneven lake WSE for ICESat-2 levels"
  expected_relations: [SUPPORTS, METHOD_RELEVANT, CONTRADICTS]
  manuscript_anchor: "6.5 Water-surface heterogeneity"
