  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V4.2:
  audit_status: NOT_TESTABLE
  findings:
  - An 18 cm daily excursion is a ~99th-percentile event at this site (|dH| median
    3.0, p90 9.0, max 20.0 cm/day, n=96 days). No local wind or pressure record exists,
    so wind setup can be neither confirmed nor excluded. Reported as unresolved.
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V5.1:
  audit_status: SUPPORTED
  findings:
  - A rank test cannot reach significance with 5 stations against 1 (p floor 0.200)
    and is not relied on. This is a local contextual term, NOT a global sensor bias
    and NOT a datum fix. No post-breach constant exists at any station.
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V6.1:
  audit_status: SUPPORTED
  findings:
  - 14.00 m is the only PUBLISHED level of the four candidates (Table 19). The honest
    uncertainty is the 0.40 m spread among three independent estimates (13.71 capacity-curve,
    14.00 published, 14.11 ICESat-2), not the CI, and it is deliberately not folded
    in. The source does not state its Baltic realisation (BS-42 vs BS-77), so a further
    few-centimetre step may be unaccounted for. The 14.11 m estimate is CIRCULAR against
    ICESat-2 and is never used as the working reference.
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V6.2:
  audit_status: SUPPORTED
  findings:
  - For quoting, 14.19 m EVRF2019; for computing, the per-sounding value.
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V7.1:
  audit_status: SUPPORTED
  findings:
  - 'The large deviations on the steep upper backwater limb (>=210 km, -0.77/-0.66/-0.10
    m) are NOT digitisation error: Table 20 has only two points across the limb and
    the true curve is convex, so the linear reference is itself wrong there by decimetres.
    The vertical axis is non-linear and was calibrated on detected gridlines; on a
    linear axis the same symbols read 0.2-0.4 m too high. Curve 4 (dash-dot) remains
    NOT digitised - it cannot be separated from dashed curve 3 by the enclosed-region
    method.'
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V7.2:
  audit_status: SUPPORTED_WITH_LIMITATION
  findings:
  - Per-date fits span a median of only 8.3 km (p75 13.1 km, max 74.4 km), so no reach
    value is a hydraulic gradient measured across that reach. The 180-210 km band
    is a geometric artefact (see V7.3) and must not be read as a hydraulic slope.
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V7.3:
  audit_status: SUPPORTED
  findings:
  - 'The first hypothesis - that chainage assignment fails where the pool is widest
    - was tested and REJECTED: that band has the smallest median offset from the channel
    line (2.5 km) of any reach.'
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V8.1:
  audit_status: SUPPORTED_WITH_LIMITATION
  findings:
  - 'NO causal attribution is made for any individual satellite date: no simultaneous
    wind or pressure forcing data exist. This is a scale-of-magnitude argument, and
    it must not be confused with the mean hydraulic slope. Documented seiche periods:
    13.4 h uninodal, 7.3 h binodal, 3.5 h trinodal.'
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V9.1:
  audit_status: SUPPORTED_WITH_LIMITATION
  findings:
  - SWORD is a MODERN-CHANNEL PROXY. This does not claim reconstruction of any specific
    pre-1956 channel, nor that any individual depression is one. The +7.38 m threshold
    is descriptive only - see V9.4.
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V9.2:
  audit_status: SUPPORTED_WITH_LIMITATION
  findings:
  - 'Stated narrowly: this validates the DRY-BED MASK and the shallow-platform selection.
    S7 contains no observations from the deepest 20 m of the sounding range (deepest
    S7 +0.86 m vs -19.38 m in the soundings), because the deep depressions still carry
    the river. It is NOT independent proof of the drowned-valley morphology.'
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V9.3:
  audit_status: SUPPORTED_WITH_LIMITATION
  findings:
  - The clearance must be taken against max(soundings, S7) because S7 reaches higher
    (15.45 m) than the soundings (15.32 m); using soundings alone would overstate
    the clearance as 5.87 m. A bed at terrace height would have indicated the survey
    or the reference level was wrong.
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V9.4:
  audit_status: UNSUPPORTED
  findings:
  - Earlier framing as two populations is WITHDRAWN and retained only as an audit
    trail. The words 'bimodal' and 'antimode' must not appear. The +7.38 m value survives
    only as a descriptive classification threshold, not a geomorphological boundary.
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V9.5:
  audit_status: REVISE_UNCERTAINTY
  findings:
  - Nearly vanishes without one band. Reported, not relied on.
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V9.6:
  audit_status: UNSUPPORTED
  findings:
  - Table 21 reports an AREA fraction, but the survey follows the navigable channel
    and avoids the shallow margins where drying occurs, so a point sample cannot estimate
    it. Superseded by V10.1.
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V10.1:
  audit_status: SUPPORTED
  findings:
  - DRAFT v1 (2026-09-10) still quotes the P20-era 12.38 % / −0.57 pp; hist17 rerun
    2026-09-13 (b3255e4, registry domain) gives 12.77 % / −0.18 pp (audit CHK-006
    FAIL). The 0.2 pp agreement is inside the ±1.14 pp datum band (C-12) and must
    not be quoted as precision.
  required_actions:
  - replace 12.38/−0.57 everywhere in the draft; requote with a datum-propagated band
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V10.2:
  audit_status: SUPPORTED
  findings:
  - 'Two quantities must not be conflated: the INTERPOLATION BOUNDARY elevation (17.08
    m EVRF2019, the observed 2023-06-05 waterline, independently constrained by the
    Rozumivka gauge at 16.88 m BS-77 AND by the historical level-area curve at ~17.1
    m BS-77 for 2 192 km2) and the EXPOSURE DENOMINATOR (NPG 16.18 m EVRF2019, restricting
    the domain to the reservoir at NPG as Table 21 does). The 2023 shoreline sat ~1
    m ABOVE project NPG - the pool had been raised - so a constraint at NPG would
    itself have been wrong. The unconstrained run is retained as an audit trail and
    is used for no result.'
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V10.3:
  audit_status: SUPPORTED
  findings:
  - '1 km blocks are PRIMARY, matched to the ~357 m median sounding spacing. 5 km
    blocks are a STRESS TEST only: the fitted variogram range is ~2 km, so they hold
    out cells beyond the correlation range of any training point and score extrapolation,
    which no method can pass. Random holdout is an OPTIMISTIC reference because survey
    lines put a near-twin of each held-out point in the training set. Residuals are
    largest within 1-3 km of the corridor where the bed is steepest - a resolution
    limit, not a bias.'
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V10.4:
  audit_status: SUPPORTED
  findings:
  - 'The datum is EXCLUDED as a cause: overall bias -0.032 m, per-reach bias spans
    only -0.105 to +0.102 m, and the elevation-dependent bias changes sign, which
    no constant offset can do. Decisive against a blocked-CV artefact: the worst 20
    residuals are as large under RANDOM hold-out (median |e| 14.54 m) as under blocked
    (15.26 m), so the hold-out does not create them. NOT claimed: that this relief
    is mathematically unrecoverable -- it cannot be reliably recovered FROM THE SOUNDING
    POINTS ALONE BY AN ORDINARY UNCONSTRAINED INTERPOLATOR; adding the historical
    channel axis, breaklines, hydrographic cross-sections or old charts as constraints
    could do considerably better. The problem is under-determined by the present data,
    not impossible.'
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
V10.5:
  audit_status: SUPPORTED_WITH_LIMITATION
  findings:
  - 'CRITICAL: this curve must NOT be used to condition the DEM. Table 21''s drying
    area is arithmetically the same information -- A(NPG) - A(GMO) = 2155 - 1876 =
    279 km2 equals Table 21''s summed reach drying area of 279 km2 exactly -- so conditioning
    on A(H) would make the V10.1 validation circular. Kept as validation, deliberately
    not as a constraint. The multi-level SATELLITE water-extent route was tested and
    rejected: only one pre-breach polygon has usable coverage (2023-06-05, 17.08 m,
    already the constraint in use), post-breach waterlines sit a median 1.69 km inside
    the pre-breach shore with only 12% of their length within 500 m of it, and ICESat-2
    profiles coincide with a usable polygon date on only 2 of 14 dates, each spanning
    <15 km, so H(x) cannot be reconstructed.'
  note: 'matrix: outputs/tables/manuscript_evidence_matrix.csv'
