# Own-data claims for the Paper 3 manuscript — every number bound to a snapshot row.
#
# `imports` take whole tables (one claim per row) from the SWOT-DNIPRO snapshot:
#   V/M/X ids from outputs/tables/manuscript_evidence_matrix.csv (value, n,
#   uncertainty, status already per row) and C ids from the audit's
#   claim_evidence_matrix.csv.
# `claims` are result families those matrices never carried. Each names the
# snapshot table (basename or repo-relative path), a `select` that must match
# exactly one row, and `value`/`uncertainty`/`n` templates whose {column} fields
# are read from that row at build time. Nothing numeric is typed here.
# `overrides` patch imported rows with what the 2026-09-18 article audit found.
# `article_theses` group claims into the AT rows of the data-evidence matrix.
#
# Table names refer to SNAPSHOT_MANIFEST.json (src/paper_3/snapshot.py).
# British spelling throughout.

imports:
  - table: outputs/tables/manuscript_evidence_matrix.csv
    family: legacy_matrix
    status_map: matrix
    paper: 1
    columns:
      id: claim_id
      statement: claim
      type: result_type
      value: value
      uncertainty: uncertainty
      n: n
      table: source_table
      figure: source_figure
      limitations: limitations
      status: validation_status
  - table: audit_runs/20260918T175108Z/claim_evidence_matrix.csv
    family: audit_C
    status_map: audit
    paper: 1
    columns:
      id: claim_id
      statement: claim_text
      status: evidence_status
      limitations: limitations
      action: required_next_test
      table: output_refs

claims:
  # ── vertical-reference provenance (from the 2026-09-18 article audit) ────────
  - id: G1
    paper: 1
    family: vertical_reference
    claim_type: provenance
    statement: >
      One production BS-77 → EVRF2019 grid is used everywhere: ua_2019z.asc
      (ESRI ASCII, 167×99 at 0.15°, 3776 valid nodes, ETRS89/GRS80), which is the
      CRS-EU distribution «UA_KRON/NH to EVRF2019zero» of the EPSG:9902 operation,
      IDW-interpolated from its 154 defining points. The Stopkhai et al. (2026)
      UKG2017 → EVRF2019 raster is a different product (mean 0.070 m) and is NOT
      used in production; the draft must cite each for what it is.
    table: outputs/tables/kakhovka_datum_comparison.csv
    value: "official correction at the posts {delta_official_m:.3f} m"
    select: {name_en: "Nova Kakhovka"}
    unit: m
    status_source: manual
    audit_status: SUPPORTED
    manuscript_section: "3.4 / 4.1"
    article_thesis: AT4
    literature_thesis_ids: [T08, T10]
    scientific_caveat: "Grid identity rests on the sha256 in provenance.json; the EPSG sanity check is consistency, not identity. v1 §3.4/§9 name EPSG registry, BKG and Stopkhai in one breath (marker REF01)."
    remaining_action: none
    blocks_submission: "no"
  - id: G2
    paper: 1
    family: vertical_reference
    claim_type: provenance
    statement: >
      The EGG2015 quasigeoid raster in production (egg_2015.tif, 1′×1′) has no
      citable upstream source: the public ISG release is 10′×15′.
    status_source: manual
    audit_status: UNKNOWN
    manuscript_section: "3.5"
    article_thesis: AT4
    literature_thesis_ids: [T08]
    scientific_caveat: "Citation problem, not a numerical one (egm2008_minus_evrs −0.145 ± 0.027 m)."
    remaining_action: "obtain the 1′ EGG2015 grid with licence, or re-run on the public grid and report the difference"
    blocks_submission: "yes"

