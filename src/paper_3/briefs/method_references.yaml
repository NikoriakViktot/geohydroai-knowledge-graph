# Standard methods the manuscript uses and must cite.
#
# These are not findings from the corpus and not positive controls: they are the
# textbook sources for estimators and tests. Every DOI here goes through the same
# CrossRef resolution as any other reference, so a wrong one is caught rather
# than printed — the assembler refuses to cite an unresolved key.
#
# `used_for` records which manuscript statement the citation supports, so a
# reference cannot drift away from the sentence that needs it.

