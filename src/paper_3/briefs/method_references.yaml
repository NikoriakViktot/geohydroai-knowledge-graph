  note: "Theil (1950), reprinted in Henri Theil's Contributions to Economics and Econometrics"

- doi: 10.1214/aos/1176344552
  used_for: "bootstrap confidence interval for the difference of medians (Methods 4.3)"
  note: "Efron (1979), bootstrap methods: another look at the jackknife"

- doi: 10.1214/088342304000000396
  used_for: "two-sided permutation test (Methods 4.3)"
  note: "Ernst (2004), permutation methods: a basis for exact inference"

- doi: 10.2307/1942661
