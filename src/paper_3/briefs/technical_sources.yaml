# Authoritative technical sources for topic B that are NOT journal papers.
#
# For a methods section these often outrank a random geodesy paper: the
# statement "ATL03 heights are in the tide-free system" comes from the ATBD, not
# from someone citing the ATBD. They are indexed poorly or not at all by
# OpenAlex, so they are listed here by hand.
#
# Every entry below is something the v1 draft already cites informally in its
# §REFERENCES. No URL is filled in unless it is known for certain — an
# invented URL is worse than an empty one. `status: url_needed` marks the gap.
#
# source_type vocabulary (mirrored in geodesy.py):
#   paper              peer-reviewed article, from the harvest
#   curated_paper      peer-reviewed article NOT reachable by the harvest (no DOI
#                      or not indexed by OpenAlex), listed by hand. Because
#                      retrieval could never recover it, it can never be a
#                      positive control — only a source.
#   technical_standard convention or resolution (IAG, ISO)
#   mission_document   ATBD, product description, user handbook
#   registry           EPSG / authoritative dataset documentation
#
# status vocabulary:
#   url_needed         no URL known for certain
#   url_verified       the URL was fetched by hand and, for a PDF, its sha256 is
#                      recorded in `url_sha256`; the download step refuses a
#                      file whose bytes differ.
#
# `mandatory: true` marks a source the manuscript must cite (user decision);
# `formal_citation` is the reference-list entry the v2 overlay appends.

