  url: ""
  status: url_needed
  mandatory: false
  note: >-
    Read 2026-09-19; full text ingested into the corpus as
    `shumilova_farewell_to_a_dam_adn8655` (881 chunks) so it is retrievable,
    but it CANNOT be a positive control: no DOI, so retrieval could never
    recover it unaided. Flow-3D shallow-water computation with a SINGLE
    Manning n = 0.035 and an inflow ramped to 29 000 m3/s over 50 minutes —
    the contrast case for the Paper 2 argument that the roughness of this
    surface is neither single-valued nor constant in time. Also reports
    899 km2 of reed belts and 648 km2 of silty sand. Replace this entry with
    the DOI once it is published.

